name: Crawl update

# 매일 00:00 UTC(=09:00 KST)에 학교 사이트를 증분 크롤링하고,
# 전처리 -> 벡터화 -> Supabase 적재 -> 우선순위(priority_score) 재계산까지 실행한다.
# 수동으로도 Actions 탭에서 "Run workflow"로 즉시 실행할 수 있다.
#
# 필요한 저장소 시크릿: DATABASE_URL (Supabase Postgres 연결 문자열)
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      recent_pages:
        description: "게시판별 최소 몇 페이지를 볼지 (보통 3. 학교 공지는 새 글이 이어지면 최대 20페이지까지 자동으로 더 봄)"
        required: false
        default: "3"

permissions:
  contents: write

concurrency:
  group: crawl-update
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    # 60 was enough for a normal day; the first run after an outage also
    # pages past the usual 3 pages (pknu_notice gap fill).
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies (Korean OCR)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-kor

      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt

      - name: Crawl + preprocess + vectorize + load (all datasets)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        # Scheduled runs have no inputs, so they fall back to 3 pages.
        run: python scripts/rag/preprocessing_pipeline_recent.py --dataset all --recent-pages "${{ inputs.recent_pages || '3' }}"

      - name: Recompute priority scores
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python scripts/ce/update_priorities.py
          python scripts/rule/update_priorities.py
          python scripts/main/update_priorities.py --dataset all

      - name: Commit updated crawl state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Department state lives under the registry storage_path
          # (files/department/<college>/<department>/<dataset>/state.json), so find it
          # instead of hardcoding one path.
          { find files/department -name state.json 2>/dev/null || true; printf '%s\n' files/rule/state.json files/pknu_main/_state/pknu_notice.json files/pknu_main/_state/pknu_student_life.json; } |
          while IFS= read -r state_path; do
            if [ -f "$state_path" ]; then
              git add -f -- "$state_path"
            fi
          done
          git diff --cached --quiet || git commit -m "chore(crawler): update crawl state [skip ci]"
          git push
